name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:        # 手动刷新榜单并提交

permissions:
  contents: read

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: pytest -v

  refresh-tierlist:
    name: Refresh Tier List
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 数据层来自上游公开数据集（需联网）；榜单计算本身完全离线。
      - name: Sync Official Game Data
        run: python -m src.collectors.game_data_sync
        continue-on-error: true

      - name: Rebuild Tier List
        run: python -m src.pipeline --beam-width 8

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A README.md docs/ data/
          if ! git diff --staged --quiet; then
            git commit -m "chore(auto): refresh pure TTK tier list [skip ci]"
            git push
          fi
