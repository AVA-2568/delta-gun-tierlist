name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  schedule:
    - cron: "30 1 * * *"     # 每日 UTC 01:30（北京 09:30）：同步当日弹药价格并重算榜单
  workflow_dispatch:        # 手动刷新榜单并提交

permissions:
  contents: read

# 榜单重算写仓库，禁止两次刷新并发执行（后到的排队等待）
concurrency:
  group: tierlist-refresh
  cancel-in-progress: false

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: pytest -v

  refresh-tierlist:
    name: Refresh Tier List
    # 管线运行期零第三方依赖（标准库），无需装环境
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 数据层来自上游公开数据集（需联网）；榜单计算本身完全离线。
      - name: Sync Official Game Data
        run: python -m src.collectors.game_data_sync
        continue-on-error: true

      # 第三方行情当日价：抓取失败时沿用现有价格表，不影响榜单产出。
      - name: Sync Ammo Prices (daily)
        run: python -m src.collectors.ammo_price_sync
        continue-on-error: true

      - name: Rebuild Tier List
        run: python -m src.pipeline --beam-width 8

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A README.md docs/ data/
          if ! git diff --staged --quiet; then
            git commit -m "chore(auto): refresh pure TTK tier list [skip ci]"
            # 运行期间若有人推了新提交，rebase 到远端最新再推，避免 non-fast-forward
            git pull --rebase origin main
            git push
          fi
