name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  schedule:
    - cron: "55 10 * * *"    # 每日 UTC 10:55（北京 18:55）触发，避开整点档（整点调度最拥挤，最易被 GitHub 丢弃）；
                             # 抓价前由 "Align to Beijing 20:00" 步骤等待到北京时间 20:00 整，
                             # 确保拿到晚间黄金时段行情（避免延迟后抓到午夜价）
  workflow_dispatch:        # 手动刷新榜单并提交

permissions:
  contents: read

# 榜单重算写仓库，禁止两次刷新并发执行（后到的排队等待）
concurrency:
  group: tierlist-refresh
  cancel-in-progress: false

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: pytest -v

  refresh-tierlist:
    name: Refresh Tier List
    # 管线运行期零第三方依赖（标准库），无需装环境
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 官方游戏数据域已转 data/tables/ 独立维护（契约：docs/superpowers/specs/2026-10-04-data-tables-design.md），上游变化用 python tools/tables_diff.py 对账后人工合入。
      # 定时触发时对齐到北京时间 20:00 整再抓价（GA schedule 高峰延迟数小时，早到则等待）；
      # 手动触发立即执行。Rebuild/price-only 紧随其后，价格列随当日 20:00 行情刷新。
      - name: Align to Beijing 20:00 (schedule only)
        if: github.event_name == 'schedule'
        run: |
          target=$(date -d '20:00 +0800' +%s)
          now=$(date +%s)
          if [ "$now" -lt "$target" ]; then
            echo "等待至北京时间 20:00 抓取行情（$((target - now)) 秒）"
            sleep $((target - now))
          else
            echo "已过北京时间 20:00（延迟触发），直接抓取当前行情"
          fi

      # 第三方行情当日价（orzice 小涛查，一次运行写出枪械+弹药+配件三张价格表）：
      # 抓取失败时沿用现有价格表，不影响榜单产出。
      - name: Sync Market Prices (orzice)
        run: python -m src.collectors.orzice_price_sync
        continue-on-error: true

      # TTK 榜单只在数据变化时重算（枪械/配件/弹药/护甲/情景表或引擎代码）：
      # --check-stale 校验输入指纹，新鲜（退出 0）时短路跳过束搜索重算；
      # 过期（退出 1，含首次上线的旧产物无指纹）时才全量重算并写入新指纹。
      - name: Rebuild Tier List (skip if inputs unchanged)
        run: |
          python -m src.pipeline --check-stale || python -m src.pipeline --beam-width 8

      # 每日价格变化只需刷新榜单价格列（击杀成本 = 带内平均期望发数 × 弹药价、
      # 整枪全价 = 裸枪价 + 180 发弹药价 + 核心配件价）并重出文档，TTK 字段保持原值。
      - name: Refresh Price Columns (daily)
        run: python -m src.pipeline --price-only

      # 对外数据表（枪械/配件/配件×枪械对接）随每日数据刷新；消费方式见 README。
      - name: Export Data Tables
        run: python -m src.export

      # 官方数据域已转 data/tables/ 独立维护（不再每日重建 provenance），此步兜底重固化
      # 残余收敛记录，防止 integrity.official_reproduction_residual 缺失令 test job fail。
      # 工具退出码语义：0=无超差点；1=存在超差点且已固化（已裁定的上游伪差，预期常态）；
      # 其余退出码为真错误。
      - name: Record Official Reproduction Residual
        run: |
          set +e
          python tools/verify_official_reproduction.py \
            --record-residual-conclusion "CI 每日自动固化：残余统计由 tools/verify_official_reproduction.py 当次全量重算写入；上游伪差白盒裁定与历史结论文案见 git 历史中的 provenance.json 记录。"
          rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then exit "$rc"; fi

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A README.md docs/ data/
          if ! git diff --staged --quiet; then
            git commit -m "chore(auto): refresh pure TTK tier list [skip ci]"
            # 运行期间若有人推了新提交，rebase 到远端最新再推，避免 non-fast-forward
            git pull --rebase origin main
            git push
          fi
